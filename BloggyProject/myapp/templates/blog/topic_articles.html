{% extends 'blog/base.html' %}

{% block title %}Articles in {{ topic.title }}{% endblock %}

{% block content %}
<h1>Articles in {{ topic.title }}</h1>
<ul>
    {% for article in articles %}
        <li><a href="{% url 'article_detail' article.id %}">{{ article.title }}</a></li>
    {% endfor %}
</ul>
{% endblock %}
