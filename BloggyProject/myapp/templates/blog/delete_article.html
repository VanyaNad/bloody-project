{% extends 'blog/base.html' %}

{% block title %}Delete Article{% endblock %}

{% block content %}
<h2>Are you sure you want to delete this article?</h2>
<p>{{ object.title }}</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'article_detail' object.pk %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
