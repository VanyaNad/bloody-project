{% for comment in comments %}
    <li>
        <p><strong>{{ comment.author }}</strong> ({{ comment.created_at|date:"M d, Y" }}):</p>
        <p>"{{ comment.content }}"</p>

        <form method="post" action="{% url 'add_comment' article.id %}">
            {% csrf_token %}
            <input type="hidden" name="parent_id" value="{{ comment.id }}">
            <textarea name="content" placeholder="Reply to this comment" rows="2" required></textarea>
            <button type="submit">Reply</button>
        </form>

        {% if comment.replies.exists %}
            <ul>
                {% include "blog/comment.html" with comments=comment.replies.all %}
            </ul>
        {% endif %}
    </li>
{% endfor %}
